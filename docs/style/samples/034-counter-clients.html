      <feComposite in="all" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
</svg>

function wrap(text, n) {
  const out = []; let line = "";
  for (const word of text.split(" ")) {
    if ((line + " " + word).trim().length > n && line) { out.push(line); line = word; } else line = (line + " " + word).trim();

  if (line) out.push(line);
  return out;
}
